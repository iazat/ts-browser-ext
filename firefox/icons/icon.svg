<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Traffic entering a tunnel. Built to degrade gracefully: at 16px the
       filled disc still reads as a solid silhouette and the arrow survives as
       a notch, rather than dissolving into a blur the way an outlined ring
       does. Deliberately unlike Tailscale's dot grid. -->
  <rect width="128" height="128" rx="28" fill="#1F1E1E"/>
  <circle cx="64" cy="64" r="42" fill="#FCFCFC"/>
  <path d="M34 64 H74 M60 45 L82 64 L60 83"
        fill="none" stroke="#3B63B8" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
